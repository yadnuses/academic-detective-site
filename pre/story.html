<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>故事线 · Fan Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: '黄令东齐伋体';
      src: url('./assets/fonts/黄令东齐伋体_mianfeiziti.com.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    :root {
      --bg: #f7f3ec;
      --bg-dark: #e8e0d4;
      --ink: #2c241b;
      --ink-light: #5a5045;
      --paper: #fffef8;
      --accent: #8b4513;
      --accent-light: #a65d2e;
      --red: #a12d2d;
      --muted: #8a7f70;
      --shadow: rgba(44, 36, 27, 0.12);
      --shadow-deep: rgba(44, 36, 27, 0.22);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.001s !important; animation-duration: 0.001s !important; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Noto Serif SC", "Songti SC", "PingFang SC", "Microsoft YaHei", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.8;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(139, 69, 19, 0.012) 3px, rgba(139, 69, 19, 0.012) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(139, 69, 19, 0.009) 3px, rgba(139, 69, 19, 0.009) 4px);
      pointer-events: none;
      z-index: 5;
    }

    /* 顶部导航 */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .top-bar > * { pointer-events: auto; }

    .brand {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    /* 旅程进度条 */
    .journey-progress {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.72rem;
    }

    .journey-progress .step {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
      white-space: nowrap;
    }

    .journey-progress .step::after {
      content: "→";
      opacity: 0.22;
      margin-left: 0.1rem;
      font-size: 0.65rem;
    }

    .journey-progress .step:last-child::after { display: none; }

    .journey-progress .step:hover { color: var(--accent); }

    .journey-progress .step.active {
      color: var(--accent);
      font-weight: 600;
    }

    .journey-progress .step.active .dot {
      background: var(--accent);
      border-color: var(--accent);
    }

    .journey-progress .step.completed {
      color: var(--accent-light);
    }

    .journey-progress .step.completed .dot {
      background: var(--accent-light);
      border-color: var(--accent-light);
    }

    .journey-progress .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
    }

    /* 全屏转场 */
    .journey-transition {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s, visibility 0.35s;
    }

    .journey-transition.active {
      pointer-events: auto;
      opacity: 1;
      visibility: visible;
    }

    .journey-transition .panel {
      position: absolute;
      inset: 0;
      background: var(--bg-dark);
      transform: translateY(100%);
      transition: transform 0.85s var(--ease);
    }

    .journey-transition.active .panel { transform: translateY(0); }

    .journey-transition .hint {
      position: relative;
      z-index: 2;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s 0.35s, transform 0.5s 0.35s;
      padding: 0 1.5rem;
    }

    .journey-transition.active .hint {
      opacity: 1;
      transform: translateY(0);
    }

    .journey-transition .next-title {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 900;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .journey-transition .next-prompt {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* Hero */
    .hero {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 1.5rem 4rem;
      position: relative;
    }

    .hero-inner { max-width: 720px; }

    .hero-label {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      color: var(--accent);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .hero h1 {
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 1.2rem;
    }

    .hero h1 span { color: var(--red); }

    .hero p {
      font-size: clamp(1rem, 1.6vw, 1.25rem);
      color: var(--ink-light);
      max-width: 560px;
      margin: 0 auto 2rem;
    }

    .hero .meta {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    /* 时间线 */
    .timeline-wrap {
      max-width: 1080px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
      position: relative;
    }

    .timeline-line {
      position: absolute;
      left: 140px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--accent-light) 5%, var(--accent-light) 95%, transparent);
    }

    .timeline-item {
      position: relative;
      display: flex;
      align-items: flex-start;
      margin-bottom: 3.5rem;
      padding-left: 180px;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s var(--ease), transform 0.8s var(--ease);
    }

    .timeline-item.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .timeline-year {
      position: absolute;
      left: 0;
      top: 1.2rem;
      width: 120px;
      text-align: right;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.05em;
    }

    .timeline-dot {
      position: absolute;
      left: 140px;
      top: 1.5rem;
      width: 12px;
      height: 12px;
      background: var(--paper);
      border: 2px solid var(--accent);
      border-radius: 50%;
      transform: translateX(-50%);
      z-index: 2;
      box-shadow: 0 0 0 5px rgba(139, 69, 19, 0.06);
    }

    .timeline-card {
      flex: 1;
      background: var(--paper);
      border: 1px solid rgba(139, 69, 19, 0.15);
      border-radius: 6px;
      padding: 2rem;
      box-shadow: 0 12px 40px var(--shadow);
      text-align: left;
      position: relative;
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
    }
    .timeline-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 60px var(--shadow-deep);
    }

    .timeline-item.key-node .timeline-card {
      border: 2px solid rgba(139, 69, 19, 0.25);
      box-shadow: 0 16px 50px var(--shadow-deep);
      transform: scale(1.02);
    }
    .timeline-item.key-node .timeline-card:hover {
      transform: scale(1.02) translateY(-4px);
    }

    .timeline-item.key-node .timeline-year {
      font-size: 1rem;
      color: var(--teal);
    }

    .timeline-card::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 0;
      height: 0;
      border: 10px solid transparent;
      transform: translateY(-50%);
    }

    .timeline-item:nth-child(odd) .timeline-card::after {
      right: -20px;
      border-left-color: var(--paper);
    }

    .timeline-item:nth-child(even) .timeline-card::after {
      left: -20px;
      border-right-color: var(--paper);
    }

    .card-year {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
      margin-bottom: 0.4rem;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.35;
      margin-bottom: 0.8rem;
      font-family: '黄令东齐伋体', 'Noto Serif SC', serif;
      letter-spacing: 0.02em;
    }

    .card-img {
      width: 100%;
      height: auto;
      max-height: 260px;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 1rem;
      display: block;
      background: var(--bg-dark);
      transition: transform 0.4s var(--ease);
      border: 8px solid #fffef8;
      box-shadow: 0 4px 16px rgba(44, 36, 27, 0.1);
      filter: sepia(8%) contrast(1.02);
    }
    .timeline-card:hover .card-img {
      transform: scale(1.01);
    }

    .card-text {
      font-size: 0.95rem;
      color: var(--ink-light);
      line-height: 1.75;
    }
    .card-text::first-letter {
      font-size: 1.6em;
      font-weight: 700;
      color: var(--accent);
      float: left;
      line-height: 0.85;
      margin: 0.05em 0.1em 0 0;
      font-family: '黄令东齐伋体', 'Noto Serif SC', serif;
    }

    .card-tag {
      display: inline-block;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.65rem;
      color: var(--muted);
      background: var(--bg);
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
      margin-top: 0.8rem;
      letter-spacing: 0.04em;
    }

    /* 结尾 */
    .closing {
      max-width: 760px;
      margin: 0 auto;
      padding: 4rem 1.5rem 8rem;
      text-align: center;
    }

    .closing .big {
      font-size: clamp(1.6rem, 4vw, 2.6rem);
      font-weight: 900;
      line-height: 1.4;
      margin-bottom: 1.5rem;
    }

    .closing .big span { color: var(--red); }

    .closing p {
      color: var(--ink-light);
      margin-bottom: 1rem;
    }

    .closing img {
      max-width: 520px;
      width: 100%;
      border: 1px solid rgba(139, 69, 19, 0.2);
      border-radius: 8px;
      box-shadow: 0 24px 70px var(--shadow-deep);
      margin: 1.5rem 0 0.5rem;
      transition: transform 0.3s var(--ease);
    }
    .closing img:hover { transform: scale(1.01); }

    .closing .caption {
      font-size: 0.8rem;
      color: var(--muted);
    }

    /* Footer */
    .footer {
      text-align: center;
      padding: 2.5rem 1.5rem;
      background: var(--ink);
      color: var(--paper);
      font-size: 0.85rem;
    }

    .footer a {
      color: var(--paper);
      text-decoration: none;
      margin: 0 0.6rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .footer a:hover { opacity: 1; }

    /* Mobile */
    @media (max-width: 768px) {
      .top-bar { padding: 1rem; }
      .nav-links { gap: 0.8rem; font-size: 0.72rem; }
      .timeline-line { left: 18px; }
      .timeline-item {
        padding-left: 44px;
        margin-bottom: 2.5rem;
      }
      .timeline-year {
        width: auto;
        left: 0;
        top: 0;
        font-size: 0.75rem;
      }
      .timeline-dot {
        left: 18px;
        top: 0.3rem;
      }
      .timeline-card {
        width: 100%;
        padding: 1.4rem;
      }
      .timeline-item.key-node .timeline-card {
        transform: scale(1);
      }
    }
  </style>
  <link rel="stylesheet" href="./assets/css/global.css">
</head>

      <h1 data-i18n="hero.title">一条<span>回家</span>的路</h1>
      <p data-i18n="hero.desc">从福建建瓯到上海，从上海到乌鲁木齐，再从乌鲁木齐走向世界。三代人的命运，被一本书、一辆公交车、一张火车票、一本相册串成一条线。</p>
      <div class="meta" data-i18n="hero.meta">1946 — 2020 · 范瑶珠家族史</div>
    </div>
  </section>

  <section class="timeline-wrap" id="timeline">
    <div class="timeline-line"></div>
  </section>

  <section class="closing">
    <div class="big" data-i18n="closing.text">二人合葬于乌鲁木齐东山生态园公墓。<br>面朝<span>东方</span>——<br>他们<span>来时的方向</span>。</div>

    <img src="./assets/photos/单张照片/J-104-01.jpg" alt="2014 年钻石婚" loading="lazy">
    <div class="caption" data-i18n="closing.caption">2014 年 · 钻石婚 · 结婚 60 周年</div>
  </section>

    <div class="hint">

      <div class="next-prompt" data-i18n="trans.prompt">继续滑动，进入下一段记忆</div>
    </div>
  </section>

        text: '孙晓舞从美国回到乌鲁木齐，全家围坐餐桌举杯。从 1953 年因国家建设而分离，到 2000 年因个人发展而跨国，团聚始终是家庭影像的核心。',
        img: './assets/photos/单张照片/C-001-01.jpg',
        tag: '物 · 团圆饭桌'
      },
      {
        year: '2013',
        title: '范瑶珠进疆六十周年',
        text: '从 1953 到 2013，一个上海护士在边疆生活了整整六十年。她亲历了乌鲁木齐从苏联援建到全球化的全过程。',
        img: '',
        tag: '时间里程碑'
      },
      {
        year: '2014',
        title: '钻石婚，结婚 60 周年',
        text: '两人庆祝钻石婚。从病房里的借书小纸条，到钻石婚合影，他们用最普通的方式，走完了一段最不普通的岁月。',
        img: './assets/photos/单张照片/J-104-01.jpg',
        tag: '人 · 相守'
      },
      {
        year: '2019',
        title: '范瑶珠去世，享年 88 岁',
        text: '她的一生跨越民国、新中国、改革开放与全球化。她用照片为家族保留了 272 个记忆切片。',
        img: '',
        tag: '人 · 告别'
      },
      {
        year: '2020', key: true,
        title: '孙钢去世，合葬面朝东方',
        text: '95 岁生日当天，孙钢去世。二人合葬于乌鲁木齐东山生态园公墓，面朝东方——他们来时的方向，也是上海的方向。',
        img: '',
        tag: '终点 · 回归'
      }
    ];

    const container = document.getElementById('timeline');
    container.innerHTML += items.map((it, i) => `
      <article class="timeline-item ${it.key ? 'key-node' : ''}" data-index="${i}">
        <div class="timeline-year">${it.year}</div>
        <div class="timeline-dot"></div>
        <div class="timeline-card">
          <div class="card-year">${it.year}</div>
          <h3 class="card-title">${it.title}</h3>
          ${it.img ? `<img class="card-img" src="${it.img}" alt="${it.title}" loading="lazy">` : ''}
          <p class="card-text">${it.text}</p>
          <span class="card-tag">${it.tag}</span>
        </div>
      </article>
    `).join('');

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('visible');
      });
    }, { threshold: 0.15, rootMargin: '0px 0px -8% 0px' });

    document.querySelectorAll('.timeline-item').forEach(el => observer.observe(el));

    // 线性体验：滚动到 story 底部后进入 museum
    (function() {
      const transition = document.getElementById('journeyTransition');
      let nearBottom = false;
      let triggered = false;

      function checkBottom() {
        nearBottom = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 120);
      }

      function goToNext(e) {
        if (triggered) return;
        if (!nearBottom) return;
        if (e && e.deltaY <= 0) return;
        triggered = true;
        if (e) e.preventDefault();
        transition.classList.add('active');
        setTimeout(() => {
          window.location.href = 'museum.html?from=story';
        }, 950);
      }

      window.addEventListener('scroll', checkBottom, { passive: true });
      checkBottom();

      document.addEventListener('wheel', goToNext, { passive: false });

      let touchStartY = 0;
      document.addEventListener('touchstart', e => {
        touchStartY = e.touches[0].clientY;
      }, { passive: true });
      document.addEventListener('touchend', e => {
        const dy = touchStartY - e.changedTouches[0].clientY;
        if (dy > 50) goToNext();
      }, { passive: true });

      transition.addEventListener('click', () => {
        if (!triggered) goToNext();
      });
    })();
  </script>
