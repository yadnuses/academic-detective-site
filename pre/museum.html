<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>物件博物馆 | Fan Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root {
      --bg: #26221c;
      --bg-dark: #1a1712;
      --ink: #f7f3ec;
      --ink-light: #d4c8b8;
      --paper: #fffef8;
      --paper-trans: rgba(255, 254, 248, 0.94);
      --accent: #d4a574;
      --accent-light: #e8c9a0;
      --muted: #8a7f70;
      --glass: rgba(255, 254, 248, 0.08);
      --shadow: rgba(0, 0, 0, 0.35);
      --shadow-deep: rgba(0, 0, 0, 0.5);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.001s !important; animation-duration: 0.001s !important; }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Noto Serif SC", "Songti SC", "PingFang SC", "Microsoft YaHei", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(139, 69, 19, 0.012) 3px, rgba(139, 69, 19, 0.012) 4px),
        repeating-linear-gradient(90deg, transparent, transparent 3px, rgba(139, 69, 19, 0.009) 3px, rgba(139, 69, 19, 0.009) 4px);
      pointer-events: none;
      z-index: 5;
    }

    /* 顶部导航 */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .top-bar > * { pointer-events: auto; }

    .brand {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .journey-progress {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.72rem;
    }

    .journey-progress .step {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
      white-space: nowrap;
    }

    .journey-progress .step::after {
      content: "→";
      opacity: 0.22;
      margin-left: 0.1rem;
      font-size: 0.65rem;
    }

    .journey-progress .step:last-child::after { display: none; }

    .journey-progress .step:hover { color: var(--accent); }

    .journey-progress .step.active {
      color: var(--accent);
      font-weight: 600;
    }

    .journey-progress .step.active .dot {
      background: var(--accent);
      border-color: var(--accent);
    }

    .journey-progress .step.completed {
      color: var(--accent-light);
    }

    .journey-progress .step.completed .dot {
      background: var(--accent-light);
      border-color: var(--accent-light);
    }

    .journey-progress .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      border: 1.5px solid currentColor;
    }

    .journey-transition {
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s, visibility 0.35s;
    }

    .journey-transition.active {
      pointer-events: auto;
      opacity: 1;
      visibility: visible;
    }

    .journey-transition .panel {
      position: absolute;
      inset: 0;
      background: var(--bg-dark);
      transform: translateX(100%);
      transition: transform 0.85s var(--ease);
    }

    .journey-transition.active .panel { transform: translateX(0); }

    .journey-transition .hint {
      position: relative;
      z-index: 2;
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s 0.35s, transform 0.5s 0.35s;
      padding: 0 1.5rem;
    }

    .journey-transition.active .hint {
      opacity: 1;
      transform: translateY(0);
    }

    .journey-transition .next-title {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 900;
      color: var(--ink);
      margin-bottom: 0.5rem;
    }

    .journey-transition .next-prompt {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.85rem;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .journey-transition .hint .btn {
      display: inline-block;
      margin-top: 1.2rem;
      padding: 0.65rem 1.4rem;
      background: var(--accent);
      color: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.05em;
      text-decoration: none;
      border-radius: 2px;
      transition: background 0.2s;
    }

    .journey-transition .hint .btn:hover { background: var(--accent-light); }

    /* 3D 场景 */
    .scene {
      position: absolute;
      inset: 0;
      perspective: 1500px;
      perspective-origin: 50% 46%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .room {
      position: relative;
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      transition: transform 1.1s var(--ease);
    }

    /* 地面 */
    .floor {
      position: absolute;
      width: 1600px;
      height: 1600px;
      left: -800px;
      top: -800px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 50%, rgba(232, 224, 212, 0.75), rgba(247, 243, 236, 0) 62%),
        repeating-radial-gradient(circle at 50% 50%, rgba(139, 69, 19, 0.05) 0, rgba(139, 69, 19, 0.05) 1px, transparent 1px, transparent 60px),
        repeating-conic-gradient(from 0deg at 50% 50%, rgba(139, 69, 19, 0.03) 0deg 0.5deg, transparent 0.5deg 72deg);
      transform: rotateX(90deg) translateZ(260px);
      opacity: 0.85;
      pointer-events: none;
    }

    /* 墙面 */
    .wall {
      position: absolute;
      width: 580px;
      height: 440px;
      left: -290px;
      top: -220px;
      background: linear-gradient(180deg, rgba(255, 254, 248, 0.55), rgba(232, 224, 212, 0.45));
      border: 1px solid rgba(139, 69, 19, 0.18);
      box-shadow: inset 0 0 80px rgba(139, 69, 19, 0.08);
      transform-style: preserve-3d;
      backface-visibility: hidden;
      pointer-events: none;
    }

    /* 展柜 */
    .vitrine {
      position: absolute;
      width: 300px;
      height: 380px;
      left: -150px;
      top: -190px;
      transform-style: preserve-3d;
      transition: opacity 0.8s var(--ease), transform 0.8s var(--ease), filter 0.8s var(--ease);
      cursor: pointer;
      user-select: none;
    }

    .vitrine-frame {
      position: relative;
      width: 100%;
      height: 100%;
      background: transparent;
      outline: 1px solid rgba(139, 69, 19, 0.15);
      box-shadow: 0 24px 70px var(--shadow);
      transform-style: preserve-3d;
      overflow: hidden;
    }

    .vitrine img.main {
      width: 100%;
      height: 72%;
      object-fit: cover;
      display: block;
      filter: sepia(0%) contrast(1.02);
      transition: filter 0.6s;
    }

    .vitrine:hover img.main { filter: sepia(0%) contrast(1.05); }

    .vitrine .depth-inline {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 72%;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.5s var(--ease), visibility 0.5s;
      z-index: 4;
      overflow: hidden;
    }

    .vitrine .depth-inline.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .vitrine .depth-inline canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: sepia(10%) contrast(0.98);
      transition: filter 0.6s;
    }

    .vitrine:hover .depth-inline canvas { filter: sepia(0%) contrast(1.02); }

    .vitrine .plaque {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent);
      color: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.35rem 0.6rem;
      border-radius: 2px;
      letter-spacing: 0.06em;
      z-index: 5;
      box-shadow: 0 2px 8px rgba(44,36,27,0.2);
    }

    .vitrine .label-card {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 1.1rem 1.2rem;
      background: var(--paper-trans);
      border-top: 1px solid rgba(139, 69, 19, 0.15);
      z-index: 5;
    }

    .vitrine .label-card .year {
      font-size: 0.72rem;
      color: var(--accent);
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .vitrine .label-card h3 {
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.35;
      color: var(--ink);
    }

    /* 非激活状态 */
    .vitrine:not(.active) {
      opacity: 0.3;
      filter: blur(2px) grayscale(35%);
      transform: scale(0.86);
    }

    .vitrine.active {
      opacity: 1;
      filter: blur(0) grayscale(0);
      transform: scale(1);
    }

    .vitrine.active .vitrine-frame {
      box-shadow: 0 40px 100px var(--shadow-deep);
    }

    .vitrine.active::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 10%;
      width: 80%;
      height: 30px;
      background: linear-gradient(to bottom, rgba(255, 254, 248, 0.25), transparent);
      transform: rotateX(-75deg);
      transform-origin: top;
      pointer-events: none;
      filter: blur(4px);
    }

    /* 展柜内容后移，营造玻璃厚度 */
    .vitrine-content {
      position: relative;
      width: 100%;
      height: 100%;
      transform: translateZ(-10px);
      transform-style: preserve-3d;
    }

    /* 展柜底座 */
    .pedestal {
      position: absolute;
      width: 220px;
      height: 50px;
      left: 50%;
      bottom: -30px;
      margin-left: -110px;
      background: linear-gradient(180deg, rgba(232, 224, 212, 0.9), rgba(210, 198, 182, 0.9));
      border: 1px solid rgba(139, 69, 19, 0.18);
      border-radius: 2px;
      box-shadow: 0 20px 40px rgba(44, 36, 27, 0.18);
      transform: translateZ(-30px) rotateX(0deg);
      transform-style: preserve-3d;
      pointer-events: none;
    }

    .pedestal::before {
      content: "";
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      height: 12px;
      background: rgba(180, 165, 146, 0.5);
      transform: rotateX(-90deg);
      transform-origin: top center;
    }

    /* 3D 模型入口徽章 */
    .model-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: linear-gradient(135deg, #9c4f1f 0%, #753812 100%);
      color: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.45rem 0.8rem;
      border-radius: 5px;
      z-index: 6;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      letter-spacing: 0.06em;
      box-shadow: 0 3px 12px rgba(117, 56, 18, 0.45);
      display: flex;
      align-items: center;
      gap: 0.32rem;
      border: 1px solid rgba(255, 254, 248, 0.25);
    }

    .model-badge::before {
      content: "";
      display: inline-block;
      width: 0.7rem;
      height: 0.7rem;
      background: currentColor;
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      opacity: 0.9;
    }

    .model-badge:hover {
      background: var(--accent-light);
      transform: scale(1.06);
      box-shadow: 0 4px 14px rgba(139, 69, 19, 0.45);
    }

    .vitrine.depth-active .model-badge {
      background: var(--ink);
      box-shadow: 0 0 0 2px var(--paper), 0 4px 14px rgba(44, 36, 27, 0.3);
    }

    /* 3D 模型全屏查看层 */
    .model-overlay {
      position: fixed;
      inset: 0;
      background: rgba(247, 243, 236, 0.96);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
      z-index: 3001;
      display: flex;
      flex-direction: column;
    }

    .model-overlay.active { opacity: 1; visibility: visible; }

    .model-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid rgba(139, 69, 19, 0.12);
    }

    .model-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .model-header .close {
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(139, 69, 19, 0.08);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background 0.2s;
    }

    .model-header .close:hover { background: rgba(139, 69, 19, 0.18); }

    .model-viewer-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
    }

    model-viewer {
      width: 100%;
      height: 100%;
      background: transparent;
      --poster-color: transparent;
    }

    /* 深度假 3D 查看层 */
    .depth-overlay {
      position: fixed;
      inset: 0;
      background: rgba(247, 243, 236, 0.96);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
      z-index: 3002;
      display: flex;
      flex-direction: column;
    }

    .depth-overlay.active { opacity: 1; visibility: visible; }

    .depth-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid rgba(139, 69, 19, 0.12);
    }

    .depth-header h3 {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .depth-header .hint {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .depth-header .close {
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(139, 69, 19, 0.08);
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background 0.2s;
    }

    .depth-header .close:hover { background: rgba(139, 69, 19, 0.18); }

    .depth-canvas-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
      overflow: hidden;
    }

    .depth-canvas-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* 底部时间轴 */
    .timeline {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.2rem 2rem 1.6rem;
      display: flex;
      justify-content: center;
      pointer-events: none;
      transform: translateY(calc(100% - 24px));
      opacity: 0.6;
      transition: transform 0.45s var(--ease), opacity 0.35s;
    }

    .timeline.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .timeline-inner {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      pointer-events: auto;
      background: rgba(38, 34, 28, 0.85);
      backdrop-filter: blur(8px);
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      border: 1px solid rgba(212, 165, 116, 0.18);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
    }

    .timeline-dot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.35rem;
      cursor: pointer;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      transition: background 0.2s;
    }

    .timeline-dot:hover { background: rgba(212, 165, 116, 0.08); }

    .timeline-dot span {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(212, 165, 116, 0.25);
      transition: background 0.3s, transform 0.3s;
    }

    .timeline-dot.active span {
      background: var(--accent);
      transform: scale(1.4);
    }

    .timeline-dot label {
      font-size: 0.65rem;
      color: var(--ink-light);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      letter-spacing: 0.03em;
      transition: color 0.3s;
    }

    .timeline-dot.active label {
      color: var(--accent);
      font-weight: 600;
    }

    .timeline-line {
      width: 24px;
      height: 1px;
      background: rgba(212, 165, 116, 0.15);
    }

    /* 当前物件提示 */
    .object-hint {
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      z-index: 1000;
      text-align: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .object-hint.visible { opacity: 1; }

    .object-hint p {
      font-size: 0.8rem;
      color: var(--ink-light);
      background: rgba(38, 34, 28, 0.85);
      backdrop-filter: blur(8px);
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      border: 1px solid rgba(212, 165, 116, 0.15);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    /* 操作提示 */
    .controls-hint {
      position: fixed;
      right: 1.5rem;
      bottom: 110px;
      z-index: 1000;
      font-size: 0.72rem;
      color: var(--ink-light);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: right;
      line-height: 1.6;
      pointer-events: none;
      opacity: 0.75;
    }

    @media (max-width: 768px) {
      .controls-hint { display: none; }
      .vitrine { width: 260px; height: 330px; left: -130px; top: -165px; }
      .wall { width: 440px; height: 350px; left: -220px; top: -175px; }
      .top-bar { padding: 1rem; }
      .journey-progress { gap: 0.45rem; font-size: 0.62rem; }
      .journey-progress .step label { display: none; }
      .journey-progress .step::after { margin-left: 0; }
      .timeline { padding: 1rem; }
      .timeline-inner { gap: 0.3rem; padding: 0.5rem 0.8rem; }
      .timeline-dot label { font-size: 0.6rem; }
      .timeline-line { width: 14px; }
    }

    /* 侧板 */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(44, 36, 27, 0.35);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s, visibility 0.4s;
      z-index: 2000;
    }

    .drawer-overlay.active { opacity: 1; visibility: visible; }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(520px, 92vw);
      height: 100%;
      background: var(--paper);
      box-shadow: -10px 0 60px rgba(44, 36, 27, 0.2);
      transform: translateX(100%);
      transition: transform 0.5s var(--ease);
      z-index: 2001;
      overflow-y: auto;
      padding: 2rem;
    }

    .drawer.active { transform: translateX(0); }

    .drawer-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 36px;
      height: 36px;
      border: none;
      background: rgba(139, 69, 19, 0.08);
      color: var(--ink);
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .drawer-close:hover { background: rgba(139, 69, 19, 0.18); }

    .drawer h3 {
      font-size: 1.6rem;
      margin-bottom: 0.4rem;
      padding-right: 2rem;
    }

    .drawer .era {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 1.2rem;
      letter-spacing: 0.02em;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .drawer img.hero {
      width: 100%;
      border-radius: 4px;
      margin-bottom: 1.2rem;
      cursor: zoom-in;
      box-shadow: 0 8px 24px rgba(44,36,27,0.12);
    }

    .drawer p {
      font-size: 0.95rem;
      line-height: 1.9;
      color: var(--ink-light);
      margin-bottom: 1rem;
    }

    .drawer .quote {
      border-left: 3px solid var(--accent);
      padding-left: 1rem;
      margin: 1.2rem 0;
      color: var(--ink);
      font-style: italic;
    }

    .drawer .quote .source {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.8rem;
      color: var(--muted);
      font-style: normal;
    }

    .drawer h4 {
      font-size: 1rem;
      color: var(--accent);
      margin: 1.8rem 0 1rem;
    }

    .related-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.8rem;
    }

    .related-grid > div {
      cursor: zoom-in;
      transition: transform 0.2s;
    }

    .related-grid > div:hover { transform: translateY(-2px); }

    .related-grid img {
      width: 100%;
      border-radius: 3px;
      display: block;
      box-shadow: 0 4px 12px rgba(44,36,27,0.1);
    }

    .related-grid .caption {
      font-size: 0.72rem;

    objects.sort((a, b) => a.year - b.year);

    // 自动为每件展品关联同名的本地深度图
    objects.forEach(obj => {
      if (!obj.depthMap) {
        const basename = obj.image.split('/').pop();
        obj.depthMap = './assets/depth/' + basename.replace(/\.[^.]+$/, '_depth.png');
      }
    });

    // 暴露给模块脚本中的 Three.js 查看器使用
    window.objects = objects;

    const N = objects.length;
    const ANGLE = 360 / N;
    const RADIUS = window.innerWidth < 768 ? 300 : 760;
    let current = 0;
    let isAnimating = false;
    let wheelTimeout = null;

    const room = document.getElementById('room');
    const timeline = document.getElementById('timeline');
    const objectHint = document.getElementById('objectHint');

    let timelineHideTimeout = null;
    const TIMELINE_HOTZONE = 140;

    function showTimeline(durationMs = 2500) {
      timeline.classList.add('visible');
      if (timelineHideTimeout) clearTimeout(timelineHideTimeout);
      timelineHideTimeout = setTimeout(() => {
        timeline.classList.remove('visible');
      }, durationMs);
    }

    function keepTimelineIfInHotZone(e) {
      const inHotZone = e.clientY > window.innerHeight - TIMELINE_HOTZONE;
      const inTimeline = e.target.closest && e.target.closest('.timeline');
      if (inHotZone || inTimeline) {
        timeline.classList.add('visible');
        if (timelineHideTimeout) clearTimeout(timelineHideTimeout);
        timelineHideTimeout = null;
      } else {
        if (timelineHideTimeout) return;
        timelineHideTimeout = setTimeout(() => {
          timeline.classList.remove('visible');
        }, 1200);
      }
    }

    document.addEventListener('mousemove', keepTimelineIfInHotZone);
    document.addEventListener('mouseleave', () => {
      if (timelineHideTimeout) clearTimeout(timelineHideTimeout);
      timelineHideTimeout = setTimeout(() => timeline.classList.remove('visible'), 600);
    });

    function initRoom() {
      // 生成展柜（移除背景墙面，避免相邻墙面半透明层叠遮挡当前照片）
      objects.forEach((obj, i) => {
        const angle = i * ANGLE;

        const vitrine = document.createElement('div');
        vitrine.className = 'vitrine' + (i === 0 ? ' active' : '');
        vitrine.dataset.index = i;
        vitrine.style.transform = `rotateY(${angle}deg) translateZ(${RADIUS}px)`;
        vitrine.innerHTML = `
          <div class="vitrine-frame" onclick="openDrawer(${i})">
            <div class="vitrine-content">
              <img class="main" src="${obj.image}" alt="${obj.title}">
              ${obj.depthMap ? `<div class="depth-inline" data-index="${i}"></div>` : ''}
              <div class="label-card">
                <div class="year">${obj.shortEra}</div>
                <h3>${obj.title}</h3>
              </div>
            </div>
          </div>
          <div class="pedestal"></div>
        `;
        room.appendChild(vitrine);
      });

      // 生成时间轴
      timeline.innerHTML = `
        <div class="timeline-inner">
          ${objects.map((obj, i) => `
            <div class="timeline-dot ${i === 0 ? 'active' : ''}" data-index="${i}" onclick="setIndex(${i})">
              <span></span>
              <label>${obj.shortEra}</label>
            </div>
            ${i < N - 1 ? '<div class="timeline-line"></div>' : ''}
          `).join('')}
        </div>
      `;

      updateRoom();
    }

    function setIndex(i) {
      let next = i % N;
      if (next < 0) next += N;
      if (next === current) return;
      if (window.closeInlineDepth) window.closeInlineDepth();
      current = next;
      updateRoom();
      showTimeline(2500);
    }

    function updateRoom() {
      room.style.transform = `rotateY(${-current * ANGLE}deg)`;

      document.querySelectorAll('.vitrine').forEach((v, i) => {
        v.classList.toggle('active', i === current);
      });

      document.querySelectorAll('.timeline-dot').forEach((d, i) => {
        d.classList.toggle('active', i === current);
      });

      const obj = objects[current];
      objectHint.innerHTML = `<p>${obj.title} · ${obj.shortEra} · 点击或按 Enter 展开故事</p>`;
      objectHint.classList.add('visible');
    }

    // 键盘控制
    document.addEventListener('keydown', (e) => {
      if (window.isInlineDepthActive && window.isInlineDepthActive()) {
        if (e.key === 'Escape') window.closeInlineDepth();
        return;
      }
      if (document.getElementById('drawer').classList.contains('active')) {
        if (e.key === 'Escape') closeDrawer();
        return;
      }
      if (document.getElementById('lightbox').classList.contains('active')) {
        if (e.key === 'Escape') closeLightbox();
        return;
      }
      if (document.getElementById('depthOverlay').classList.contains('active')) {
        if (e.key === 'Escape') window.closeDepth();
        return;
      }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
        if (current === N - 1) {
          goToMap();
        } else {
          setIndex(current + 1);
        }
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
        setIndex(current - 1);
      } else if (e.key === 'Enter') {
        openDrawer(current);
      } else if (e.key === 'Escape') {
        closeDrawer();
        closeLightbox();
      }
    });

    // 线性体验：最后一件展品后进入迁移地图
    let journeyTransitionTriggered = false;
    function goToMap() {
      if (journeyTransitionTriggered) return;
      journeyTransitionTriggered = true;
      const trans = document.getElementById('journeyTransition');
      if (trans) trans.classList.add('active');
      setTimeout(() => {
        window.location.href = 'migration_timeline.html?from=museum';
      }, 950);
    }

    document.getElementById('enterMapBtn').addEventListener('click', (e) => {
      e.preventDefault();
      goToMap();
    });

    // 滚轮控制
    document.addEventListener('wheel', (e) => {
      if (document.getElementById('drawer').classList.contains('active')) return;
      const dir = Math.sign(e.deltaY);
      if (current === N - 1 && dir > 0) {
        e.preventDefault();
        goToMap();
        return;
      }
      e.preventDefault();
      if (wheelTimeout) return;
      setIndex(current + dir);
      wheelTimeout = setTimeout(() => { wheelTimeout = null; }, 900);
    }, { passive: false });

    // 拖拽与滑动
    let startX = 0;
    let isDragging = false;

    const scene = document.getElementById('scene');

    scene.addEventListener('mousedown', (e) => {
      if (e.target.closest('.vitrine') || e.target.closest('.timeline')) return;
      isDragging = true;
      startX = e.clientX;
    });

    document.addEventListener('mouseup', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 40) {
        if (current === N - 1 && dx < 0) {
          goToMap();
          return;
        }
        setIndex(current + (dx < 0 ? 1 : -1));
      }
    });

    scene.addEventListener('touchstart', (e) => {
      if (e.target.closest('.vitrine') || e.target.closest('.timeline')) return;
      startX = e.touches[0].clientX;
      isDragging = true;
    }, { passive: true });

    scene.addEventListener('touchend', (e) => {
      if (!isDragging) return;
      isDragging = false;
      const dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 30) {
        if (current === N - 1 && dx < 0) {
          goToMap();
          return;
        }
        setIndex(current + (dx < 0 ? 1 : -1));
      }
    }, { passive: true });

    // 侧板
    function openDrawer(index) {
      const obj = objects[index];
      const content = document.getElementById('drawerContent');
      content.innerHTML = `
        <h3>${obj.title}</h3>
        <div class="era">${obj.era}</div>
        <img class="hero" src="${obj.image}" alt="${obj.title}" onclick="openLightbox('${obj.image}')">
        <p style="font-size:1.05rem; color: var(--ink-light);">${obj.lead}</p>
        <p>${obj.context}</p>
        ${obj.quote ? `
          <div class="quote">"${obj.quote.text}"<span class="source">—— ${obj.quote.source}</span></div>
        ` : ''}
        <h4>相关照片</h4>
        <div class="related-grid">
          ${obj.related.map(photo => `
            <div onclick="openLightbox('${photo.src}')">
              <img src="${photo.src}" alt="${photo.caption}">
              <div class="caption">${photo.caption}</div>
            </div>
          `).join('')}
        </div>
      `;
      document.getElementById('drawerOverlay').classList.add('active');
      document.getElementById('drawer').classList.add('active');
    }

    function closeDrawer() {
      document.getElementById('drawerOverlay').classList.remove('active');
      document.getElementById('drawer').classList.remove('active');
    }

    function openLightbox(src) {
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox').classList.add('active');
    }

    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('active');
    }

    function openModel(index) {
      const obj = objects[index];
      if (!obj.modelUrl) return;
      document.getElementById('modelTitle').textContent = obj.title + ' · 3D 模型';
      document.getElementById('modelViewer').src = obj.modelUrl;
      document.getElementById('modelOverlay').classList.add('active');
    }

    function closeModel() {
      document.getElementById('modelOverlay').classList.remove('active');
      document.getElementById('modelViewer').src = '';
    }

    function open3D(index) {
      const obj = objects[index];
      if (obj.modelUrl) {
        openModel(index);
      } else if (obj.depthMap && window.toggleInlineDepth) {
        window.toggleInlineDepth(index);
      }
    }

    document.getElementById('modelOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'modelOverlay') closeModel();
    });

    // 初始化
    initRoom();

    // 入场动画
    setTimeout(() => {
      room.style.opacity = '1';
    }, 100);
  </script>

  <script type="module">
    import * as THREE from 'three';

    let depthRenderer, depthCamera, depthScene, depthMesh, depthMaterial;
    let depthAnimId = null;
    let activeInlineContainer = null;
    let depthContainer = null;
    let currentDepthAspect = 1;
    let introWobbleStart = null;
    const depthMouse = { x: 0, y: 0, tx: 0, ty: 0 };
    const textureCache = new Map();

    async function ensureRenderer() {
      if (depthRenderer) return;
      depthRenderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      depthRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      depthScene = new THREE.Scene();
      depthCamera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);
      depthCamera.position.z = 1.8;
      window.addEventListener('resize', onDepthResize);
    }

    window.isInlineDepthActive = () => !!activeInlineContainer;

    function stopAnimation() {
      if (depthAnimId) {
        cancelAnimationFrame(depthAnimId);
        depthAnimId = null;
      }
    }

    function getVitrineForContainer(container) {
      return container && container.closest('.vitrine');
    }

    window.closeInlineDepth = () => {
      stopAnimation();
      if (activeInlineContainer) {
        const vitrine = getVitrineForContainer(activeInlineContainer);
        if (vitrine) vitrine.classList.remove('depth-active');
        activeInlineContainer.classList.remove('active');
        activeInlineContainer = null;
      }
      depthContainer = null;
      introWobbleStart = null;
      depthMouse.tx = 0;
      depthMouse.ty = 0;
    };

    window.toggleInlineDepth = async (index) => {
      const obj = window.objects[index];
      if (!obj || !obj.depthMap) return;
      const container = document.querySelector(`.depth-inline[data-index="${index}"]`);
      if (!container) return;

      if (activeInlineContainer === container) {
        window.closeInlineDepth();
        return;
      }

      window.closeInlineDepth();
      activeInlineContainer = container;
      depthContainer = container;
      await ensureRenderer();

      const vitrine = getVitrineForContainer(container);
      if (vitrine) vitrine.classList.add('depth-active');

      container.innerHTML = '';
      container.appendChild(depthRenderer.domElement);
      container.classList.add('active');
      introWobbleStart = performance.now();

      await initDepthScene(container, obj.image, obj.depthMap);
    };

    async function loadTexture(url, isColor) {
      if (textureCache.has(url)) return textureCache.get(url);
      const loader = new THREE.TextureLoader();
      const tex = await new Promise((resolve, reject) => loader.load(url, resolve, undefined, reject));
      if (isColor) {
        tex.colorSpace = THREE.SRGBColorSpace;
      } else {
        tex.colorSpace = THREE.NoColorSpace;
        tex.minFilter = THREE.LinearFilter;
        tex.magFilter = THREE.LinearFilter;
      }
      textureCache.set(url, tex);
      return tex;
    }

    async function initDepthScene(container, colorUrl, depthUrl) {
      depthContainer = container;
      const containerW = container.clientWidth;
      const containerH = container.clientHeight;
      const pixelRatio = Math.min(window.devicePixelRatio, 2);

      const [colorTex, depthTex] = await Promise.all([
        loadTexture(colorUrl, true),
        loadTexture(depthUrl, false)
      ]);

      const aspect = colorTex.image.width / colorTex.image.height;
      currentDepthAspect = aspect;
      const containerAspect = containerW / containerH;
      let renderW, renderH;
      if (aspect > containerAspect) {
        renderH = containerH;
        renderW = containerH * aspect;
      } else {
        renderW = containerW;
        renderH = containerW / aspect;
      }
      depthRenderer.setSize(renderW * pixelRatio, renderH * pixelRatio, false);
      depthCamera.aspect = aspect;
      depthCamera.updateProjectionMatrix();

      const h = 1.6;
      const w = h * aspect;

      if (depthMesh) {
        depthScene.remove(depthMesh);
        depthMesh.geometry.dispose();
        depthMaterial.dispose();
      }

      const geometry = new THREE.PlaneGeometry(w, h, 256, 256);
      depthMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uColor: { value: colorTex },
          uDepth: { value: depthTex },
          uDisplacement: { value: 0.9 },
          uMouse: { value: new THREE.Vector2(0, 0) },
          uTime: { value: 0 }
        },
        vertexShader: `
          uniform sampler2D uDepth;
          uniform float uDisplacement;
          uniform vec2 uMouse;
          varying vec2 vUv;
          void main() {
            vUv = uv;
            float d = texture2D(uDepth, uv).r;
            d = pow(d, 1.5);
            vec3 pos = position;
            pos.z -= d * uDisplacement;
            pos.x += uMouse.x * 0.18 * (1.0 - d);
            pos.y += uMouse.y * 0.18 * (1.0 - d);
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
          }
        `,
        fragmentShader: `
          uniform sampler2D uColor;
          varying vec2 vUv;
          void main() {
            gl_FragColor = texture2D(uColor, vUv);
          }
        `
      });

      depthMesh = new THREE.Mesh(geometry, depthMaterial);
      depthScene.add(depthMesh);

      depthAnimId = requestAnimationFrame(animateDepth);
    }

    function animateDepth(time) {
      depthAnimId = requestAnimationFrame(animateDepth);
      if (!depthMaterial || !depthContainer) return;

      let targetX = depthMouse.tx;
      let targetY = depthMouse.ty;
      if (introWobbleStart !== null) {
        const elapsed = time - introWobbleStart;
        const duration = 1800;
        if (elapsed < duration) {
          const t = elapsed / duration;
          targetX = Math.sin(t * Math.PI * 3.0) * 0.85;
        } else {
          introWobbleStart = null;
        }
      }

      depthMouse.x += (targetX - depthMouse.x) * 0.08;
      depthMouse.y += (targetY - depthMouse.y) * 0.08;
      depthMaterial.uniforms.uMouse.value.set(depthMouse.x, depthMouse.y);
      depthMaterial.uniforms.uTime.value = time * 0.001;
      depthMesh.rotation.y = Math.sin(time * 0.00025) * 0.025 + depthMouse.x * 0.14;
      depthMesh.rotation.x = depthMouse.y * 0.14;
      depthCamera.position.x = depthMouse.x * 0.22;
      depthCamera.position.y = depthMouse.y * 0.16;
      depthCamera.lookAt(0, 0, 0);
      depthRenderer.render(depthScene, depthCamera);
    }

    function updateMouseFromEvent(e, container) {
      const rect = container.getBoundingClientRect();
      depthMouse.tx = ((e.clientX - rect.left) / rect.width - 0.5) * 2;
      depthMouse.ty = -((e.clientY - rect.top) / rect.height - 0.5) * 2;
    }

    document.addEventListener('mousemove', (e) => {
      if (!activeInlineContainer) return;
      updateMouseFromEvent(e, activeInlineContainer);
    });

    document.addEventListener('touchmove', (e) => {
      if (!activeInlineContainer) return;
      const touch = e.touches[0];
      updateMouseFromEvent(touch, activeInlineContainer);
    }, { passive: true });

    document.addEventListener('click', (e) => {
      if (!activeInlineContainer) return;
      if (e.target.closest('.depth-inline') || e.target.closest('.model-badge')) return;
      window.closeInlineDepth();
    });

    function onDepthResize() {
      if (!depthContainer || !depthRenderer) return;
      const containerW = depthContainer.clientWidth;
      const containerH = depthContainer.clientHeight;
      const pixelRatio = Math.min(window.devicePixelRatio, 2);
      const containerAspect = containerW / containerH;
      let renderW, renderH;
      if (currentDepthAspect > containerAspect) {
        renderH = containerH;
        renderW = containerH * currentDepthAspect;
      } else {
        renderW = containerW;
        renderH = containerW / currentDepthAspect;
      }
      depthRenderer.setSize(renderW * pixelRatio, renderH * pixelRatio, false);
      depthCamera.aspect = currentDepthAspect;
      depthCamera.updateProjectionMatrix();
    }

    // 保留全屏查看接口，但默认不通过徽章调用
    window.openDepth = async (index) => {
      const obj = window.objects[index];
      if (!obj || !obj.depthMap) return;
      document.getElementById('depthTitle').textContent = obj.title + ' · 立体照片';
      document.getElementById('depthOverlay').classList.add('active');
      activeInlineContainer = null;
      await ensureRenderer();
      const container = document.getElementById('depthCanvasWrap');
      container.innerHTML = '';
      container.appendChild(depthRenderer.domElement);
      await initDepthScene(container, obj.image, obj.depthMap);
    };

    window.closeDepth = () => {
      document.getElementById('depthOverlay').classList.remove('active');
      stopAnimation();
      depthContainer = null;
    };

    document.getElementById('depthOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'depthOverlay') window.closeDepth();
    });
  </script>

  <script src="./assets/js/audio-controller.js"></script>

    window.fanI18nDict = {
      'brand.title': { zh: 'Fan Family · 视觉档案', en: 'Fan Family · Visual Archive' },
      'nav.story': { zh: '故事线', en: 'Story' },
      'nav.museum': { zh: '物件博物馆', en: 'Museum' },
      'nav.map': { zh: '迁移地图', en: 'Migration Map' },
      'hint.controls': { zh: '← → 切换展柜 | Enter 或点击展开 | Esc 关闭', en: '← → Switch | Enter or click to expand | Esc to close' },
      'btn.enterMap': { zh: '进入迁移地图', en: 'Enter Migration Map' },
      'trans.next': { zh: '迁移地图', en: 'Migration Map' },
      'trans.prompt': { zh: '继续滑动，进入下一段记忆', en: 'Keep scrolling to the next memory' }
    };
  </script>
