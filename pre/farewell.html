<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One Last Thing | Fan Family</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Noto Serif SC", serif;
    }

    .stage {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 45%, rgba(120, 120, 130, 0.22), transparent 55%);
      opacity: 0;
      animation: fadeInGlow 1.6s ease forwards 0.4s;
    }

    @keyframes fadeInGlow {
      to { opacity: 1; }
    }

    .line {
      font-size: clamp(1.8rem, 6vw, 4.5rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.4;
      opacity: 0;
      transform: translateY(24px);
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Noto Sans SC", sans-serif;
    }

    .line:nth-child(2) { animation-delay: 0.2s; }
    .line:nth-child(3) { animation-delay: 0.4s; }
    .line:nth-child(4) { animation-delay: 0.6s; }
    .line:nth-child(5) { animation-delay: 0.8s; }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    .accent {
      color: rgba(255, 255, 255, 0.65);
      font-size: clamp(1.2rem, 3vw, 2rem);
      margin-top: 1.5rem;
    }

    .cta {
      margin-top: 3rem;
      opacity: 0;
      transform: translateY(16px);
      animation: rise 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards 1.4s;
    }

    .cta a {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.8rem;
      border-radius: 999px;
      background: transparent;
      color: #fff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      border: 1.5px solid rgba(255,255,255,0.5);
      transition: transform 0.25s ease, background 0.25s ease, color 0.25s ease, box-shadow 0.25s ease;
    }

    .cta a:hover {
      transform: scale(1.04);
      background: #fff;
      color: #000;
      box-shadow: 0 0 28px rgba(255,255,255,0.28);
    }

    .hint {
      position: fixed;
      bottom: 2rem;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.45);
      opacity: 0;
      animation: rise 0.9s ease forwards 1.8s;
    }

    .vertical-text {
      position: absolute;
      right: 5%;
      top: 50%;
      transform: translateY(-50%);
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: clamp(0.8rem, 1.2vw, 1.1rem);
      letter-spacing: 0.3em;
      color: rgba(255,255,255,0.35);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      opacity: 0;
      animation: rise 0.9s ease forwards 1.6s;
    }

    .back {
      position: fixed;
      top: 1.4rem;
      left: 1.6rem;
      z-index: 10;
      color: rgba(255,255,255,0.65);
      text-decoration: none;
      font-size: 0.85rem;
      transition: color 0.2s;
      opacity: 0;
      animation: rise 0.8s ease forwards 1.6s;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .back:hover { color: #fff; }
  </style>
  <link rel="stylesheet" href="./assets/css/global.css">
</head>
<body>
  <a href="classmates.html" class="back" data-i18n="back.text">← 返回同学地图</a>
  <div class="glow"></div>
  <div class="stage">
    <div class="vertical-text" data-i18n="vertical.text">后会有期</div>
    <div class="line" data-i18n="line.one">One last thing.</div>
    <div class="line" data-i18n="line.two">这个夏天，</div>
    <div class="line" data-i18n="line.three">我们从地图上的坐标，</div>
    <div class="line" data-i18n="line.four">变成彼此记忆里的家人。</div>
    <div class="line accent" data-i18n="line.accent">后会有期。</div>
    <div class="cta">
      <a href="index.html">
        <span data-i18n="cta.back">回到封面</span>
        <span>→</span>
      </a>
    </div>
  </div>
  <div class="hint" data-i18n="hint.text">Fan Family 视觉档案 · 2024 夏</div>
  <script src="./assets/js/pjax.js"></script>
  <script src="./assets/js/audio-controller.js"></script>
  <script>
    window.fanI18nDict = {
      'back.text': { zh: '← 返回同学地图', en: '← Back to Classmates' },
      'line.one': { zh: 'One last thing.', en: 'One last thing.' },
      'line.two': { zh: '这个夏天，', en: 'This summer,' },
      'line.three': { zh: '我们从地图上的坐标，', en: 'we turned from coordinates on a map,' },
      'line.four': { zh: '变成彼此记忆里的家人。', en: 'into family in each other\'s memories.' },
      'line.accent': { zh: '后会有期。', en: 'See you again.' },
      'cta.back': { zh: '回到封面', en: 'Back to Cover' },
      'hint.text': { zh: 'Fan Family 视觉档案 · 2024 夏', en: 'Fan Family Visual Archive · Summer 2024' },
      'vertical.text': { zh: '后会有期', en: 'See you' }
    };
  </script>
  <script src="./assets/js/i18n.js"></script>
</body>
</html>
