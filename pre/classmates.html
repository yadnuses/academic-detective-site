<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同学分布图 | Fan Family</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f7f3ec;
      --ink: #2c241b;
      --ink-light: #5a5045;
      --paper: #fffef8;
      --accent: #8b4513;
      --accent-light: #a65d2e;
      --muted: #8a7f70;
      --shadow: rgba(44, 36, 27, 0.18);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Noto Serif SC", "Songti SC", "PingFang SC", "Microsoft YaHei", Georgia, serif;
      background: var(--bg);
      color: var(--ink);
    }

    #map {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      padding: 1.2rem 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      pointer-events: none;
    }

    .top-bar > * { pointer-events: auto; }

    .brand {
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.02em;
      background: rgba(247, 243, 236, 0.82);
      backdrop-filter: blur(6px);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(139, 69, 19, 0.1);
    }

    .back-btn {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.78rem;
      color: var(--ink-light);
      text-decoration: none;
      background: rgba(247, 243, 236, 0.82);
      backdrop-filter: blur(6px);
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      border: 1px solid rgba(139, 69, 19, 0.1);
      transition: color 0.2s, border-color 0.2s;
    }
    .back-btn:hover { color: var(--accent); border-color: rgba(139, 69, 19, 0.25); }

    /* 左侧同学列表 */
    .drawer {
      position: fixed;
      top: 5rem;
      left: 1.2rem;
      bottom: 1.8rem;
      width: 280px;
      z-index: 900;
      background: rgba(255, 254, 248, 0.92);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(139, 69, 19, 0.12);
      border-radius: 16px;
      box-shadow: 0 8px 32px var(--shadow);
      display: flex;
      flex-direction: column;
      transform: translateX(0);
      transition: transform 0.4s var(--ease);
    }

    .drawer.collapsed { transform: translateX(calc(-100% - 1.5rem)); }

    .drawer-header {
      padding: 1rem 1.1rem 0.7rem;
      border-bottom: 1px solid rgba(139, 69, 19, 0.1);
    }

    .drawer-header h2 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ink);
    }

    .drawer-header p {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 0.2rem;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .search-input {
      width: 100%;
      margin-top: 0.6rem;
      padding: 0.45rem 0.7rem;
      border: 1px solid rgba(139, 69, 19, 0.15);
      border-radius: 8px;
      background: rgba(255, 254, 248, 0.9);
      font-size: 0.75rem;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--ink);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .search-input:focus {
      border-color: rgba(139, 69, 19, 0.35);
      box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.08);
    }
    .search-input::placeholder { color: var(--muted); }

    .classmate-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem;
    }

    .classmate-list::-webkit-scrollbar { width: 5px; }
    .classmate-list::-webkit-scrollbar-thumb {
      background: rgba(139, 69, 19, 0.18);
      border-radius: 3px;
    }

    .classmate-btn {
      width: 100%;
      text-align: left;
      padding: 0.65rem 0.8rem;
      margin-bottom: 0.35rem;
      border: none;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    .classmate-btn:hover { background: rgba(139, 69, 19, 0.06); }
    .classmate-btn.active { background: rgba(139, 69, 19, 0.12); }

    .classmate-btn .dot {
      flex-shrink: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
    }

    .classmate-btn .info {
      min-width: 0;
    }

    .classmate-btn .name {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .classmate-btn .meta {
      font-size: 0.68rem;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .drawer-toggle {
      position: fixed;
      top: 5rem;
      left: 1.2rem;
      z-index: 901;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid rgba(139, 69, 19, 0.12);
      background: rgba(255, 254, 248, 0.92);
      backdrop-filter: blur(10px);
      color: var(--accent);
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--shadow);
      transition: transform 0.3s var(--ease), opacity 0.3s;
      display: none;
      align-items: center;
      justify-content: center;
    }

    /* 右侧卡片 */
    .card {
      position: fixed;
      top: 5rem;
      right: 1.2rem;
      width: 340px;
      max-height: calc(100vh - 7rem);
      z-index: 950;
      background: rgba(255, 254, 248, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(139, 69, 19, 0.12);
      border-radius: 18px;
      box-shadow: 0 12px 44px var(--shadow);
      padding: 1.4rem;
      overflow-y: auto;
      transform: translateX(calc(100% + 2rem));
      opacity: 0;
      transition: transform 0.45s var(--ease), opacity 0.35s;
    }

    .card.active {
      transform: translateX(0);
      opacity: 1;
    }

    .card-close {
      position: absolute;
      top: 0.8rem;
      right: 0.9rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(139, 69, 19, 0.08);
      color: var(--ink-light);
      font-size: 1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .card-close:hover { background: rgba(139, 69, 19, 0.16); }

    .card-avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(139,69,19,0.12), rgba(139,69,19,0.05));
      border: 2px solid rgba(139, 69, 19, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      color: var(--accent);
      margin-bottom: 0.8rem;
      overflow: hidden;
    }
    .card-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      padding-right: 1.5rem;
    }

    .card .en-name {
      font-size: 0.8rem;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin-bottom: 1rem;
    }

    .card .tag {
      display: inline-block;
      font-size: 0.72rem;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--accent);
      background: rgba(139, 69, 19, 0.08);
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      margin-bottom: 0.9rem;
      margin-right: 0.35rem;
    }

    .card .section-title {
      font-size: 0.7rem;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin: 1rem 0 0.4rem;
    }

    .card p {
      font-size: 0.88rem;
      line-height: 1.7;
      color: var(--ink-light);
    }

    .empty-tip {
      position: fixed;
      bottom: 1.8rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 800;
      background: rgba(255, 254, 248, 0.88);
      backdrop-filter: blur(6px);
      padding: 0.55rem 1.1rem;
      border-radius: 999px;
      border: 1px solid rgba(139, 69, 19, 0.1);
      font-size: 0.75rem;
      color: var(--muted);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      pointer-events: none;
      opacity: 0.85;
    }

    .one-last-btn {
      position: fixed;
      bottom: 1.8rem;
      right: 1.8rem;
      z-index: 1000;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
      white-space: nowrap;
      box-shadow: 0 4px 16px rgba(44, 36, 27, 0.18);
    }
    .one-last-btn:hover { transform: scale(1.05); background: var(--accent); box-shadow: 0 6px 22px rgba(44, 36, 27, 0.25); }

    @media (max-width: 900px) {
      .drawer { width: 260px; }
      .card { width: calc(100vw - 2.4rem); right: 1.2rem; }
    }

    @media (max-width: 768px) {
      .drawer { top: 4.2rem; left: 0.8rem; bottom: 0.8rem; width: calc(100vw - 1.6rem); }
      .card { top: 4.2rem; right: 0.8rem; left: 0.8rem; width: auto; }
      .drawer-toggle { display: flex; }
      .one-last-btn { bottom: 1rem; right: 1rem; font-size: 0.65rem; padding: 0.45rem 0.8rem; }
    }
  </style>

</head>

    function initMap() {
      scene = new Scene({
        id: 'map',
        map: new MapLibre({
          style: baseStyle,
          center: [30, 22],
          zoom: 1.9,
          pitch: 0,
          rotation: 0
        }),
        logoVisible: false
      });
      window.scene = scene;

      const features = classmates.map((p, i) => ({
        type: 'Feature',
        properties: { ...p, index: i },
        geometry: {
          type: 'Point',
          coordinates: [p.lng, p.lat]
        }
      }));

      scene.on('loaded', () => {
        pointLayer = new PointLayer({ zIndex: 4 })
          .source({ type: 'FeatureCollection', features }, { cluster: true, clusterOption: { radius: 40, maxZoom: 8 } })
          .shape('circle')
          .size(10)
          .color('#8b4513')
          .style({ strokeWidth: 2.5, stroke: '#fffef8', opacity: 0.95 });

        pulseLayer = new PointLayer({ zIndex: 3 })
          .source({ type: 'FeatureCollection', features })
          .shape('circle')
          .size(22)
          .color('#8b4513')
          .style({ strokeWidth: 0, opacity: 0.22 });

        labelLayer = new PointLayer({ zIndex: 5 })
          .source({ type: 'FeatureCollection', features })
          .shape('name_cn', 'text')
          .size(12)
          .color('#2c241b')
          .style({
            textOffset: [0, -18],
            stroke: '#fffef8',
            strokeWidth: 3,
            textAllowOverlap: true,
            fontFamily: 'PingFang SC, Microsoft YaHei, Noto Sans CJK SC, serif',
            textAnchor: 'center'
          });

        scene.addLayer(pulseLayer);
        scene.addLayer(pointLayer);
        scene.addLayer(labelLayer);

        const map = scene.map;
        function updateLabelVisibility() {
          const zoom = map.getZoom();
          if (labelLayer) labelLayer.style({ textAllowOverlap: true, opacity: zoom > 4 ? 1 : 0 });
        }
        map.on('zoomend', updateLabelVisibility);
        updateLabelVisibility();

        pointLayer.on('click', (e) => {
          const p = e.feature.properties;
          selectClassmate(p.index);
        });

        pointLayer.on('mousemove', () => { document.body.style.cursor = 'pointer'; });
        pointLayer.on('mouseout', () => { document.body.style.cursor = 'default'; });
      });
    }

    function initList() {
      const list = document.getElementById('classmateList');
      list.innerHTML = classmates.map((p, i) => `
        <button class="classmate-btn" data-index="${i}">
          <span class="dot"></span>
          <div class="info">
            <div class="name">${p.name_cn || p.name_en}</div>
            <div class="meta">${p.university.split(' ')[0]}</div>
          </div>
        </button>
      `).join('');

      list.querySelectorAll('.classmate-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.dataset.index, 10);
          selectClassmate(idx);
          if (window.innerWidth <= 768) {
            document.getElementById('drawer').classList.add('collapsed');
          }
        });
      });

      const search = document.getElementById('classmateSearch');
      if (search) {
        search.addEventListener('input', (e) => {
          const q = e.target.value.trim().toLowerCase();
          list.querySelectorAll('.classmate-btn').forEach(btn => {
            const idx = parseInt(btn.dataset.index, 10);
            const p = classmates[idx];
            const text = `${p.name_cn} ${p.name_en} ${p.university} ${p.major}`.toLowerCase();
            btn.style.display = text.includes(q) ? '' : 'none';
          });
        });
      }
    }

    function selectClassmate(index) {
      const p = classmates[index];
      if (!p) return;

      document.querySelectorAll('.classmate-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = document.querySelector(`.classmate-btn[data-index="${index}"]`);
      if (activeBtn) {
        activeBtn.classList.add('active');
        activeBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }

      document.getElementById('cardName').textContent = p.name_cn || p.name_en;
      document.getElementById('cardEnName').textContent = p.name_en || '';
      const avatar = document.getElementById('cardAvatar');
      const initial = (p.name_cn || p.name_en || '?').trim().charAt(0);
      avatar.innerHTML = `<span style="font-family:'Noto Serif SC',serif;font-weight:700">${initial}</span>`;
      document.getElementById('cardTags').innerHTML = `
        <span class="tag">${p.university}</span>
        <span class="tag">${p.major}</span>
      `;
      document.getElementById('cardBio').textContent = p.bio_cn || p.bio_en || '暂无简介';
      document.getElementById('card').classList.add('active');

      if (scene && scene.map) {
        scene.map.flyTo({
          center: [p.lng, p.lat],
          zoom: 6,
          speed: 0.8,
          curve: 1.2
        });
      }
    }

    document.getElementById('cardClose').addEventListener('click', () => {
      document.getElementById('card').classList.remove('active');
      document.querySelectorAll('.classmate-btn').forEach(b => b.classList.remove('active'));
    });

    const drawer = document.getElementById('drawer');
    const drawerToggle = document.getElementById('drawerToggle');
    drawerToggle.addEventListener('click', () => {
      drawer.classList.toggle('collapsed');
      drawerToggle.style.display = drawer.classList.contains('collapsed') ? 'flex' : 'none';
    });

    loadData();
  </script>
